name: Build and test

# Every push: engine tests (Linux + Windows), the Windows installer is built, installed and started
# on a real Windows computer (self-test + screenshot). A tag like v0.2.0 publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Bundled tools (FFmpeg 8.1, DeepFilterNet)
        run: python3 tools/bundle_runtime.py tools
      - name: Engine tests (with the tools the app ships)
        working-directory: engine
        env:
          STUDIO_BIN: ${{ github.workspace }}/desktop/build/bin
          STUDIO_DEEP_FILTER: ${{ github.workspace }}/desktop/build/bin/deep-filter
        run: uv run pytest -q tests
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Editor logic tests
        run: node tools/tests/test_studio2.mjs && node tools/tests/test_studio3.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bundle Python, FFmpeg 8.1 and DeepFilterNet
        run: python tools/bundle_runtime.py
      - name: Engine tests on Windows (with the bundled tools)
        working-directory: engine
        env:
          STUDIO_BIN: ${{ github.workspace }}\desktop\build\bin
          STUDIO_DEEP_FILTER: ${{ github.workspace }}\desktop\build\bin\deep-filter.exe
          PYTHONUTF8: "1"
        run: |
          $env:PATH = "$env:STUDIO_BIN;$env:PATH"
          uv run pytest -q tests/test_engine.py
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run dist:win
      - name: Install it silently and start it (self-test)
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/Studio-Pro-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Studio Pro\Studio Pro.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Out-Host; throw "not installed" }
          $env:STUDIO_SELFTEST = "$PWD\selftest"
          $p = Start-Process $exe -PassThru -Wait
          Get-Content selftest\selftest.json | Out-Host
          Get-Content "$env:APPDATA\Studio Pro\logs\engine.log" -Tail 40 -ErrorAction SilentlyContinue | Out-Host
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-selftest
          path: selftest/
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Pro-Windows-installer
          path: desktop/dist/Studio-Pro-Setup-*.exe
          retention-days: 30
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/Studio-Pro-Setup-*.exe
          body: |
            **Windows:** download `Studio-Pro-Setup-…exe` below, double-click it, and follow the steps.
            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app is not signed yet).
